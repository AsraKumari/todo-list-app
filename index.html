<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="style.css" />
  <title>Todo App</title>
</head>
<body>
  <div class="container">
    <header>
      <h1>My Todos</h1>
      <button id="theme-toggle" title="Toggle Theme">
        <img id="theme-icon" src="bx-moon.svg" alt="Theme Icon" />
      </button>
    </header>

    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="Add a new task..." autocomplete="off" />
      <button type="submit">Add</button>
    </form>

    <input type="text" id="search" placeholder="Search todos..." />

    <ul id="todo-list"></ul>

    <div id="empty-state">🎉 You're all caught up!</div>

    <div id="progress-container">
      <div id="progress-text">0 of 0 completed</div>
      <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <div id="undo-toast">
      <span>Todo deleted.</span>
      <button id="undo-btn">Undo</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
